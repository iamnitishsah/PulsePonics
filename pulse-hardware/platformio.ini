; PulsePonics ESP32 firmware
; Build/upload/monitor:  pio run -t upload -t monitor      (or "Upload and Monitor" in CLion)
; Unit tests (on the Mac): pio test -e native

[platformio]
default_envs = esp32dev          ; plain "pio run" only builds the ESP32 firmware

[env:esp32dev]
platform = espressif32 @ 8.0.0   ; pinned to the version this project was tested with
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
    paulstoffregen/OneWire @ ^2.3.8              ; DS18B20 bus
    milesburton/DallasTemperature @ ^4.0.6       ; DS18B20
    256dpi/MQTT @ ^2.5.2                         ; MQTT client (QoS 1, LWT)
    bblanchon/ArduinoJson @ ^7.0.0               ; JSON payload
    adafruit/Adafruit BME280 Library @ ^2.2.4    ; air temp / humidity / pressure (Checkpoint 7)
    adafruit/Adafruit ADS1X15 @ ^2.5.0           ; ADS1115 ADC for pH + EC (Checkpoint 8)

; Runs the pure-math unit tests in test/ on the Mac. Never builds src/ (that needs the ESP32).
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
