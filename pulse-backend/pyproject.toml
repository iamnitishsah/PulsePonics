[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-backend"
version = "1.0.0"
description = "PulsePonics Backend Service in FastAPI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0,<0.120.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.29",
    "aiomysql>=0.2.0",
    "asyncmy>=0.2.9",
    "paho-mqtt>=2.0.0",
    "pyjwt[crypto]>=2.8.0",
    "bcrypt>=4.1.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

