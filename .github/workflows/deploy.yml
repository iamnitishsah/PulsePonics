name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pulse-backend/requirements.txt

      - name: Install dependencies
        working-directory: pulse-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        working-directory: pulse-backend
        run: |
          pytest tests/ -v

  test-frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: pulse-frontend/package-lock.json

      - name: Install dependencies
        working-directory: pulse-frontend
        run: npm ci

      - name: Run unit tests
        working-directory: pulse-frontend
        run: npm test

      - name: Build frontend
        working-directory: pulse-frontend
        run: npm run build
        env:
          VITE_API_URL: "https://placeholder.api"

  deploy-ec2:
    name: Deploy to AWS EC2
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            echo "=========================================="
            echo "🚀 Deploying PulsePonics updates to EC2..."
            echo "=========================================="
            
            # 1. Navigate to the PulsePonics repository on EC2
            cd /home/ubuntu/PulsePonics
            
            # 2. Pull the latest code
            git pull origin main
            
            # 3. Rebuild and launch updated containers
            docker compose --profile prod up -d --build
            
            # 4. Wait for services to initialize
            echo "⏳ Waiting for backend to become healthy..."
            sleep 8
            
            # 5. Check container health status
            docker compose ps
            
            # 6. Verify healthz endpoint
            curl --fail http://127.0.0.1:8080/api/healthz || exit 1
            echo "✅ Health check passed: backend is operational!"
            
            # 7. Clean up old dangling Docker images to conserve disk space
            docker image prune -f
            
            echo "=========================================="
            echo "🎉 Deployment completed successfully!"
            echo "=========================================="
