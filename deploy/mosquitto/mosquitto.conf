# PulsePonics broker. Credentials and the ACL are generated at container start
# by entrypoint.sh from the MQTT_* variables in .env.

listener 1883
allow_anonymous false
password_file /mosquitto/run/passwd
acl_file /mosquitto/run/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
